<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>RBD Machine Tools | Interactive Catalogue</title><meta name="description" content="Explore all 32 pages of the official RBD Machine Tools agricultural equipment catalogue."/><meta name="theme-color" content="#101114"/>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1c20;--muted:#94969b;--red:#ed343d;--white:#fafafa}*{box-sizing:border-box}html{height:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--white);overflow:hidden}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
.background{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 75% 15%,#353038 0,transparent 47%),radial-gradient(ellipse at 18% 86%,#27272e 0,transparent 53%),#111216}.background:after{content:"";position:absolute;inset:0;opacity:.19;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:65px 65px;mask-image:linear-gradient(to right,transparent,#000,transparent)}
.top{position:fixed;z-index:20;top:0;left:0;right:0;height:78px;padding:0 clamp(18px,4vw,65px);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#101114f5,#101114bf 75%,transparent);gap:16px}.logo{display:flex;align-items:center;gap:13px}.logoMark{display:grid;place-items:center;background:var(--red);width:48px;height:40px;border-radius:9px;font-weight:900;font-style:italic;letter-spacing:-2px}.logoText{font-weight:800;font-size:14px;letter-spacing:.09em;line-height:1.25}.logoText small{display:block;font-size:9px;font-weight:500;color:#b0b0b6;letter-spacing:.18em;margin-top:4px}.topActions{display:flex;align-items:center;gap:10px}.tag{font-size:11px;font-weight:600;color:#c4c5c9;letter-spacing:.13em;text-transform:uppercase;margin-right:14px}.pill{display:inline-flex;align-items:center;gap:9px;padding:11px 16px;background:#ffffff0f;border:1px solid #ffffff24;border-radius:50px;font-size:12px;font-weight:650;transition:background .25s,transform .25s}.pill:hover{background:#ffffff20;transform:translateY(-2px)}
.progress{position:fixed;z-index:25;top:0;height:3px;background:var(--red);width:0%;transition:width .55s cubic-bezier(.25,.8,.25,1);box-shadow:0 0 12px #ed343d99}
.scroller{position:fixed;inset:0;overflow-y:auto;overscroll-behavior-y:contain;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}.slide{min-height:100dvh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;align-items:center;justify-content:center;padding:82px 78px 89px}.slideInner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:clamp(28px,6vw,110px)}.editorial{width:min(290px,23vw);flex-shrink:0;opacity:0;transform:translateY(27px);transition:opacity .75s ease,transform .75s cubic-bezier(.2,.7,.25,1)}.slide.visible .editorial{opacity:1;transform:translateY(0)}.eyebrow{display:flex;align-items:center;gap:9px;color:#ff565e;font-size:11px;letter-spacing:.19em;font-weight:800}.eyebrow:before{content:"";height:2px;width:24px;background:var(--red)}h1{font-size:clamp(24px,3.1vw,52px);line-height:1.11;letter-spacing:-.045em;margin:20px 0;max-width:340px}p.info{font-size:14px;line-height:1.75;color:#a9a9b0;max-width:290px}.fine{font-size:11px;color:#8e8f99;letter-spacing:.15em;text-transform:uppercase;margin-top:35px}.pageFrame{max-width:min(640px,43vw);height:min(74dvh,810px);aspect-ratio:595/842;position:relative;display:flex;align-items:center;justify-content:center;isolation:isolate;opacity:0;transform:translateY(48px) scale(.958);transition:opacity .85s ease,transform .9s cubic-bezier(.19,1,.22,1);will-change:transform}.slide.visible .pageFrame{opacity:1;transform:translateY(0) scale(1)}.pageFrame:before{content:"";position:absolute;inset:5% -5% -2%;background:#000;filter:blur(42px);opacity:.55;z-index:-1}.pageFrame:after{content:"";position:absolute;inset:0;border:1px solid #ffffff3b;pointer-events:none}.pageFrame canvas{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:white;box-shadow:0 18px 75px #0009}.loadingPage{position:absolute;inset:0;background:linear-gradient(110deg,#222 8%,#343439 18%,#222 33%);background-size:250% 100%;animation:skeleton 2s ease-in-out infinite;z-index:-1}@keyframes skeleton{to{background-position-x:-200%}}
.rail{position:fixed;z-index:10;right:clamp(14px,3vw,48px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}.dot{display:block;width:5px;height:5px;border:0;padding:0;background:#ffffff50;border-radius:50%;transition:all .3s}.dot.active{height:20px;background:var(--red);border-radius:5px}.dot:hover{background:#fff}.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,65px);background:linear-gradient(0deg,#101114f5,#10111480 80%,transparent)}.count{font-size:12px;font-weight:750;letter-spacing:.12em}.count span{color:#96969c}.arrows{display:flex;gap:9px}.arrow{border:1px solid #ffffff35;background:#ffffff10;color:white;width:42px;height:42px;border-radius:50%;font-size:22px;transition:.2s}.arrow:hover{background:var(--red);border-color:var(--red)}.scrollHint{color:#a6a6ad;text-transform:uppercase;letter-spacing:.16em;font-size:10px;display:flex;align-items:center;gap:10px}.mouse{display:inline-flex;border:1px solid #a3a3a8;border-radius:9px;width:17px;height:26px;justify-content:center;padding-top:5px}.mouse:after{content:"";width:2px;height:6px;border-radius:5px;background:var(--red);animation:bob 1.5s infinite}@keyframes bob{to{transform:translateY(6px);opacity:0}}.error{position:fixed;z-index:35;inset:20% 15%;display:none;text-align:center;align-content:center;background:#1a1b1e;border:1px solid #ffffff2e;border-radius:18px;padding:28px}.error a{color:#ff676d;text-decoration:underline}
@media(max-width:900px){.slide{padding:88px 34px 90px}.slideInner{gap:18px}.editorial{width:min(250px,29vw)}.pageFrame{max-width:58vw;height:min(73dvh,760px)}h1{font-size:clamp(21px,3vw,37px)}.rail{right:12px}.tag{display:none}}
@media(max-width:640px){.top{height:66px;padding:0 16px}.logoMark{width:39px;height:34px;font-size:14px}.logoText{font-size:11px}.logoText small{font-size:8px;letter-spacing:.1em}.pill{padding:9px 12px;font-size:11px}.slide{padding:77px 22px 85px}.slideInner{flex-direction:column;gap:12px;justify-content:center}.editorial{width:100%;max-width:390px;flex:0 0 auto;text-align:left}.eyebrow{font-size:9px;letter-spacing:.14em}h1{font-size:clamp(19px,5.5vw,30px);margin:8px 0 4px}p.info,.fine{display:none}.pageFrame{height:auto;width:auto;max-width:min(85vw,440px);max-height:min(67dvh,630px);aspect-ratio:595/842;flex:1;min-height:0}.pageFrame canvas{object-fit:contain}.rail{right:6px;gap:6px}.dot{width:3px;height:3px}.dot.active{height:12px}.bottom{height:70px;padding:0 18px}.scrollHint{font-size:8px;letter-spacing:.08em}.arrow{height:38px;width:38px}.count{font-size:11px}}
@media(max-height:650px) and (max-width:640px){.slide{padding-top:70px;padding-bottom:62px}.pageFrame{max-height:60dvh}.editorial h1{font-size:18px}.bottom{height:55px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="background"></div><div id="progress" class="progress"></div>
<header class="top"><a href="#page-1" class="logo" aria-label="RBD catalogue home"><span class="logoMark">RBD</span><span class="logoText">MACHINE TOOLS<small>AGRICULTURAL INNOVATION</small></span></a><nav class="topActions"><span class="tag">THE PRODUCT COLLECTION · 2026</span><a class="pill" href="RBD-Catalogue-Web.pdf" target="_blank" rel="noopener" download>↓ Download Catalogue</a></nav></header>
<main class="scroller" id="scroller"></main><nav class="rail" id="rail" aria-label="Catalogue page navigation"></nav>
<footer class="bottom"><span id="counter" class="count">01 <span>/ 32</span></span><div class="scrollHint"><span class="mouse"></span> SCROLL TO EXPLORE</div><div class="arrows"><button class="arrow" id="prev" aria-label="Previous page">↑</button><button class="arrow" id="next" aria-label="Next page">↓</button></div></footer>
<div class="error" id="error"><h2>Catalogue couldn't load</h2><p>Please check your internet connection or open the original PDF.</p><a href="RBD-Catalogue-Web.pdf" target="_blank" rel="noopener">Open original PDF</a></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(()=>{'use strict';
const pdfPath='RBD-Catalogue-Web.pdf';
const names=['Welcome to RBD','Our Story','Recognition & Trust','Self Start Steering Power Reaper','Power Reaper Collection','Power Reaper Specifications','Brush Cutter Attachments','Brush Cutter Collection','Combined Rice Mill','Rice Mill','Grading Machine','Corn Thresher','Self-Start Petrol Power Weeder','Front-Rotary Power Weeder','Back-Rotary Power Weeder','Diesel Power Weeder','Chaff Cutter','Manual Seeder','Earth Auger','Power Sprayer','Battery Sprayer','Sprayer Range','Portable Power Sprayer','Agricultural Equipment','Garden Machinery','Hedge Trimmer','Petrol Lawn Mower','Rice Planter','Chokidar','Product Range','Our Branches','Contact RBD'];
const scroller=document.getElementById('scroller'),rail=document.getElementById('rail');
let pdf=null,active=1,rendering=new Set(),completed=new Set();
for(let i=1;i<=32;i++){
const s=document.createElement('section');s.className='slide';s.id='page-'+i;s.dataset.page=i;
const title=names[i-1];s.innerHTML='<div class="slideInner"><div class="editorial"><div class="eyebrow">RBD COLLECTION &nbsp; / &nbsp; '+String(i).padStart(2,'0')+'</div><h1>'+title+'</h1><p class="info">Explore the original RBD agricultural machinery catalogue. Scroll to discover the next page with a seamless transition.</p><div class="fine">QUALITY • INNOVATION • RELIABILITY</div></div><div class="pageFrame"><div class="loadingPage"></div><canvas aria-label="Catalogue page '+i+'"></canvas></div></div>';scroller.append(s);
const dot=document.createElement('button');dot.className='dot';dot.setAttribute('aria-label','Go to page '+i);dot.onclick=()=>go(i);rail.append(dot);
}
const slides=[...document.querySelectorAll('.slide')],dots=[...rail.children];
function go(n){if(n<1||n>32)return;slides[n-1].scrollIntoView({behavior:'smooth',block:'start'})}
document.getElementById('prev').onclick=()=>go(active-1);document.getElementById('next').onclick=()=>go(active+1);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();go(active+1)}if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();go(active-1)}});
function focus(n){active=n;document.getElementById('counter').innerHTML=String(n).padStart(2,'0')+' <span>/ 32</span>';document.getElementById('progress').style.width=(100*n/32)+'%';dots.forEach((d,j)=>d.classList.toggle('active',j===n-1));for(let j=Math.max(1,n-2);j<=Math.min(32,n+2);j++)renderPage(j)}
const io=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting){e.target.classList.add('visible');if(e.intersectionRatio>=0.52)focus(+e.target.dataset.page)}}},{root:scroller,threshold:[0,.1,.52,.8]});slides.forEach(s=>io.observe(s));
async function renderPage(n){if(!pdf||rendering.has(n)||completed.has(n))return;rendering.add(n);const s=slides[n-1],canvas=s.querySelector('canvas'),frame=s.querySelector('.pageFrame');try{const page=await pdf.getPage(n),v=page.getViewport({scale:1});let scale=Math.min(2,Math.max(1.1,(frame.clientWidth||430)*Math.min(2,window.devicePixelRatio||1)/v.width));const viewport=page.getViewport({scale});canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport}).promise;frame.querySelector('.loadingPage').remove();completed.add(n)}catch(err){console.error('Page render error',n,err)}finally{rendering.delete(n)}}
async function load(){try{if(!window.pdfjsLib)throw Error('PDF renderer failed to load');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdf=await pdfjsLib.getDocument({url:pdfPath}).promise;focus(1)}catch(err){console.error('Catalogue load failed',err);document.getElementById('error').style.display='grid'}}
load();focus(1);
})();
</script></body></html>
