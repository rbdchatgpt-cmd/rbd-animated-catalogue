# Manage ONLY the existing RBD enquiry API with a connection to the existing private database.
# The main website and static site are intentionally not managed by this Blueprint.
services:
  - type: web
    name: rbd-field-cinema-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: cd api && npm install --omit=dev --no-audit --no-fund
    startCommand: cd api && node server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://rbd-field-cinema-next.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: rbd-field-cinema-leads
          property: connectionString
